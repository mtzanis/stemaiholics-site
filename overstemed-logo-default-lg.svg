<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="80" viewBox="0 0 400 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="v5-loop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="v5-loop2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="stem-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="v5-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(40, 40)">
    <g transform="scale(0.8)">
      <!-- Infinity loop -->
      <path
        d="M -25 0 Q -25 -15 -15 -15 Q -5 -15 0 -5 Q 5 -15 15 -15 Q 25 -15 25 0 Q 25 15 15 15 Q 5 15 0 5 Q -5 15 -15 15 Q -25 15 -25 0 Z"
        fill="none"
        stroke="url(#v5-loop1)"
        stroke-width="4"
        filter="url(#v5-glow)"
        opacity="0.9"
      />

      <!-- Second layer -->
      <path
        d="M -22 0 Q -22 -12 -14 -12 Q -6 -12 0 -4 Q 6 -12 14 -12 Q 22 -12 22 0 Q 22 12 14 12 Q 6 12 0 4 Q -6 12 -14 12 Q -22 12 -22 0 Z"
        fill="none"
        stroke="url(#v5-loop2)"
        stroke-width="2"
        opacity="0.6"
      />

      <!-- Data nodes -->
      <circle cx="-15" cy="0" r="4" fill="url(#v5-loop1)" opacity="0.9"/>
      <circle cx="15" cy="0" r="4" fill="url(#v5-loop2)" opacity="0.9"/>
      <circle cx="0" cy="0" r="5" fill="#8b5cf6" opacity="0.95"/>

      <!-- Angular accents -->
      <g stroke="url(#v5-loop1)" stroke-width="1.5" fill="none" opacity="0.3">
        <path d="M -35 0 L -25 0" />
        <path d="M 25 0 L 35 0" />
        <path d="M 0 -35 L 0 -25" />
        <path d="M 0 25 L 0 35" />
      </g>
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(96, 40)">
    <!-- STEM -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="50px" font-weight="bold" fill="url(#stem-gradient)" dominant-baseline="middle">STEM</text>

    <!-- AI -->
    <text x="125" y="0" font-family="Arial, sans-serif" font-size="50px" font-weight="bold" fill="url(#ai-gradient)" dominant-baseline="middle">AI</text>

    <!-- holics -->
    <text x="190" y="0" font-family="Arial, sans-serif" font-size="50px" font-weight="bold" fill="#2563eb" dominant-baseline="middle" font-style="normal">holics</text>

    <!-- Tagline -->
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="14px" font-weight="normal" fill="#64748b" letter-spacing="2" text-transform="uppercase">EDTECH CONSULTING</text>
  </g>
</svg>