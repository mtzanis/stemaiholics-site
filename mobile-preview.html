<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>overSTEMED Mobile Preview</title>
    <style>
      :root {
        --bg: #efe5d7;
        --frame: #1f2a2c;
        --screen: #111111;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(30, 107, 111, 0.14), transparent 28%),
          linear-gradient(180deg, #f7f1e8 0%, var(--bg) 100%);
        color: #1f2a2c;
      }

      .preview-shell {
        display: grid;
        gap: 1rem;
        justify-items: center;
      }

      .preview-shell p {
        margin: 0;
        font-size: 0.95rem;
      }

      .phone-frame {
        width: 390px;
        max-width: 100%;
        height: 844px;
        padding: 12px;
        border-radius: 42px;
        background: var(--frame);
        box-shadow: 0 24px 80px rgba(31, 42, 44, 0.22);
      }

      .phone-screen {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 30px;
        background: var(--screen);
      }

      .phone-notch {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        width: 34%;
        height: 24px;
        border-radius: 0 0 18px 18px;
        background: var(--frame);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="preview-shell">
      <p>Mobile preview for overSTEMED</p>
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="index.html" title="Mobile preview of overSTEMED"></iframe>
        </div>
      </div>
    </div>
  </body>
</html>
